plugins { id 'com.android.application' }

// ZIP timestamps have no timezone. A native input dated in the future keeps
// Ninja's CMake manifest perpetually out of date after regeneration.
def nativeSourceDirectory = layout.projectDirectory.dir('src/main/cpp').asFile
def normalizeNativeSourceTimestamps = tasks.register('normalizeNativeSourceTimestamps') {
    group = 'build'
    description = 'Corrects future native-source timestamps before native configure, build and clean.'
    // No outputs: this clock-dependent check must also run on incremental builds.
    doLast {
        long currentMillis = System.currentTimeMillis()
        int corrected = 0
        nativeSourceDirectory.eachFileRecurse(groovy.io.FileType.FILES) { File nativeInput ->
            if (nativeInput.lastModified() > currentMillis) {
                if (!nativeInput.setLastModified(currentMillis)) {
                    throw new GradleException("Cannot correct future timestamp: ${nativeInput}")
                }
                corrected++
            }
        }
        if (corrected > 0) {
            logger.lifecycle("Corrected future timestamps on ${corrected} native source files.")
        }
    }
}
tasks.configureEach { Task nativeTask ->
    // externalNativeBuildClean also invokes Ninja, which can regenerate CMake
    // before cleaning. It needs this preparation even for a standalone clean.
    if (nativeTask.name.startsWith('configureCMake') ||
            nativeTask.name.startsWith('buildCMake') ||
            nativeTask.name.startsWith('externalNativeBuild')) {
        nativeTask.dependsOn(normalizeNativeSourceTimestamps)
    }
}

android {
    namespace 'com.ast.re4decomp'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.ast.re4decomp'
        minSdk 21
        targetSdk 35
        versionCode 66
        // with the release's name: the app menu shows it ("(v0.41.0-alpha)", without the flavour's
        // suffix), the error report and the start screen as it is ("0.41.0-alpha-core"). Numbering
        // since 0.40.0 (decision of the project owner, 20.10.2026): each alpha raises the middle
        // number, a hotfix the last; versionCode counts on
        versionName '0.42.0-alpha'
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
    }
    // classic: the app's own game modules (arm64-v8a), as before; since
    //   17.10.2026 app id "com.ast.re4decomp.classic" (installable next to the core app).
    // core: the original game core (port/whole) runs the whole game
    //   (armeabi-v7a and, since milestone 12, arm64-v8a in one APK). The app is called
    //   "CubeEvil4", app id "com.ast.cubeevil4" since 18.10.2026 (until then
    //   "com.ast.re4decomp", until 17.10.2026 "com.ast.re4decomp.core"; decisions of the
    //   project owner). The Java package (namespace) stays com.ast.re4decomp.
    //   Before building it, run in WSL/Linux:
    //   port/tools/whole_build_android.sh  (copies the core libraries to
    //   src/core/jniLibs/<abi>; see port/docs/whole-program-status.md)
    flavorDimensions 'engine'
    productFlavors {
        classic {
            dimension 'engine'
            applicationIdSuffix '.classic'
            ndk { abiFilters 'arm64-v8a' }
        }
        core {
            dimension 'engine'
            applicationId 'com.ast.cubeevil4'
            versionNameSuffix '-core'
            // the core's libraries load each other from the APK by name
            // (the module libraries at run time): Android 6.0 and later
            minSdk 23
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
            externalNativeBuild { cmake { arguments '-DRE4_CORE_MODE=ON' } }
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    // the libraries extracted at installation (decision of the project owner, 20.10.2026): a 32-bit
    // device whose Java heap lies on MEM1 runs the core as a program of its own
    // (libre4_coreproc.so, port/docs/32bit-kernprozess.md), and Android runs programs only from
    // the extracted library folder. The APK gets smaller (libraries compressed), the installed
    // size stays about the same (only the device's ABI is extracted).
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
}

dependencies {
    // RetroTouch (MIT, github.com/Andiweli/RetroTouch): the touch controls of the core mode
    // (TouchControls). An update replaces libs/retrotouch.aar; the file name carries no version.
    implementation files('libs/retrotouch.aar')
}
